
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Terre AR</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin:0; overflow:hidden;">

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

      <a-assets>
        <img id="LuneTex" src="lune.jpg">
      </a-assets>

      <a-marker type="pattern" url="Lune.patt">

        <!-- Lune -->
        <a-sphere 
          position="0 2 0"
          radius="0.7"
          rotation="0 0 0"
          src="#LuneTex"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 30000; easing: linear">
        </a-sphere>

        <!-- Texte au-dessus de la Lune -->
        <a-text
          value="Lune"
          position="0 3.1 0"
          align="center"
          color="#FFFFFF"
          width="4"
          shader="msdf"
          font="https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/roboto/Roboto-Regular.json">
        </a-text>

      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

  </body>
</html>
